# Publica as Edge Functions no Supabase sempre que elas mudam no main
# (ou manualmente em Actions → "Publicar Edge Functions" → Run workflow).
#
# Secrets necessários (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  token pessoal: https://supabase.com/dashboard/account/tokens
#   GEMINI_API_KEY         opcional: também grava a chave do Gemini nos secrets das funções
name: Publicar Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PROJECT_REF: ffobtptwztsykwlflnme
    steps:
      - uses: actions/checkout@v4

      - name: Conferir token do Supabase
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o secret SUPABASE_ACCESS_TOKEN (GitHub → Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar funções (validação de sessão feita dentro de cada função)
        run: |
          for fn in nfce-proxy receipt-ai inventory-ai; do
            echo "::group::$fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
            echo "::endgroup::"
          done

      - name: Gravar GEMINI_API_KEY nas funções
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: supabase secrets set GEMINI_API_KEY="$GEMINI_API_KEY" --project-ref "$PROJECT_REF"

      - name: Resumo
        run: supabase functions list --project-ref "$PROJECT_REF"
